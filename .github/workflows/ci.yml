name: CI

on:
  pull_request:
  push:
    branches: [master, main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: ghcr.io/${{ github.repository }}

jobs:
  quality:
    name: Tests and lint
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: mangako_api
          POSTGRES_USER: mangako
          POSTGRES_PASSWORD: mangako
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U mangako -d mangako_api"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://mangako:mangako@localhost:5432/mangako_api
      API_TOKEN: ci-token
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.95.0
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test

  arm64-smoke:
    name: ARM64 smoke test
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Build and start ARM64 stack
        env:
          API_TOKEN: arm64-smoke-token
        run: docker compose up -d --build --wait
      - name: Verify health, OpenAPI, and authenticated routing
        run: |
          curl --fail --silent --show-error http://localhost:3000/health
          curl --fail --silent --show-error http://localhost:3000/api-docs/openapi.json >/dev/null
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' \
            --header 'Authorization: Bearer arm64-smoke-token' \
            'http://localhost:3000/mangas?limit=0')" = "400"
      - name: Show service logs
        if: always()
        env:
          API_TOKEN: arm64-smoke-token
        run: docker compose logs --no-color
      - name: Stop ARM64 stack
        if: always()
        env:
          API_TOKEN: arm64-smoke-token
        run: docker compose down --volumes

  image:
    name: Multi-architecture image
    needs: [quality, arm64-smoke]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Generate image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=sha
            type=raw,value=latest,enable={{is_default_branch}}
      - name: Build and publish
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: mode=max
          sbom: true
