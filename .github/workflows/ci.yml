name: CI

on:
  pull_request:
  push:
    branches: [master, main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  quality:
    name: Tests and lint
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: mangako_api
          POSTGRES_USER: mangako
          POSTGRES_PASSWORD: mangako
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U mangako -d mangako_api"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://mangako:mangako@localhost:5432/mangako_api
      API_TOKEN: ci-token
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.95.0
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test

  arm64-smoke:
    name: ARM64 smoke test
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Build and start ARM64 stack
        env:
          API_TOKEN: arm64-smoke-token
        run: docker compose up -d --build --wait
      - name: Verify health, OpenAPI, and authenticated routing
        run: |
          curl --fail --silent --show-error http://localhost:3000/health
          curl --fail --silent --show-error http://localhost:3000/api-docs/openapi.json >/dev/null
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' \
            --header 'Authorization: Bearer arm64-smoke-token' \
            'http://localhost:3000/mangas?limit=0')" = "400"
      - name: Show service logs
        if: always()
        env:
          API_TOKEN: arm64-smoke-token
        run: docker compose logs --no-color
      - name: Stop ARM64 stack
        if: always()
        env:
          API_TOKEN: arm64-smoke-token
        run: docker compose down --volumes

  image:
    name: Multi-architecture image
    needs: [quality, arm64-smoke]
    uses: ./.github/workflows/docker.yml
    secrets: inherit

  deploy:
    name: Deploy production
    needs: image
    if: >-
      github.event_name == 'push' &&
      github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    concurrency:
      group: production-deploy
      cancel-in-progress: false
    steps:
      - name: Configure the production host key
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' '147.15.69.58 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAINLrNji9HsxQW2UuQvyrMNdJaxVZJGI/PejHuibMOE66' > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
      - name: Load the deployment key
        uses: webfactory/ssh-agent@v0.9.1
        with:
          ssh-private-key: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}
      - name: Update the API
        run: |
          ssh -o BatchMode=yes ubuntu@147.15.69.58 '
            cd /opt/mangako-api &&
            docker compose --env-file .env.production -f docker-compose.prod.yml pull api &&
            docker compose --env-file .env.production -f docker-compose.prod.yml up -d --no-deps --wait api
          '
