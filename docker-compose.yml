services:
  api:
    image: ${MANGAKO_API_IMAGE:-mangako-api:local}
    build: .
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://mangako:mangako@postgres:5432/mangako_api
      HTTP_ADDR: 0.0.0.0:3000
      API_READ_TOKEN: ${API_READ_TOKEN:?set API_READ_TOKEN before starting the API}
      API_WRITE_TOKEN: ${API_WRITE_TOKEN:?set API_WRITE_TOKEN before starting the API}
      MAX_JSON_BODY_BYTES: ${MAX_JSON_BODY_BYTES:-65536}
      RATE_LIMIT_REQUESTS_PER_MINUTE: ${RATE_LIMIT_REQUESTS_PER_MINUTE:-120}
      RATE_LIMIT_MAX_CLIENTS: ${RATE_LIMIT_MAX_CLIENTS:-10000}
      TRUST_PROXY_HEADERS: ${TRUST_PROXY_HEADERS:-false}
      CACHE_TTL_SECONDS: ${CACHE_TTL_SECONDS:-60}
      CACHE_MAX_ENTRIES: ${CACHE_MAX_ENTRIES:-1000}
      CACHE_MAX_BYTES: ${CACHE_MAX_BYTES:-67108864}
      COVER_STORAGE_DIR: /var/lib/mangako/covers
      COVER_PUBLIC_BASE_URL: ${COVER_PUBLIC_BASE_URL:-http://localhost:3000/media}
      MAX_COVER_UPLOAD_BYTES: ${MAX_COVER_UPLOAD_BYTES:-8388608}
      RUST_LOG: ${RUST_LOG:-mangako_api=info,tower_http=info}
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:3000/health"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: mangako_api
      POSTGRES_USER: mangako
      POSTGRES_PASSWORD: mangako
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mangako -d mangako_api"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
